<form id="createCustomer">
<div>
   <select id="title" name="title" style="vertical-align: bottom;" class="select">
        <option value="" selected="">Select...</option>
        <option value="Mr">Mr</option>
        <option value="Mr &amp; Mrs">Mr &amp; Mrs</option>
        <option value="Baroness">Baroness</option>
        <option value="Baron">Baron</option>
        <option value="Lord">Lord</option>
        <option value="Lady">Lady</option>
        <option value="Sir">Sir</option>
        <option value="General">General</option>
        <option value="Captain">Captain</option>
        <option value="Mrs">Mrs</option>
        <option value="Miss">Miss</option>
        <option value="Ms">Ms</option>
        <option value="Doctor">Doctor</option>
        <option value="Professor">Professor</option>
        <option value="Reverend">Reverend</option>
        <option value="Sister">Sister</option>
    </select>
    <input class="input" id="firstName" name="firstName" type="text" value="" placeholder="First" size="15">
    <input class="input" id="lastName" name="lastName" type="text" value="" placeholder="Last">
</div> 

<div>
    <label><span>Telephone Numbers</span></label><br/>
    <input class="input" id="telephoneN1" name="telephoneN1" type="text" value="">
    <input class="input" id="telephoneN2" name="telephoneN2" type="text" value="">
    <input class="input" id="telephoneN3" name="telephoneN3" type="text" value="">
    <input class="input" id="telephoneN4" name="telephoneN4" type="text" value="">
</div> 

<div>
    <input id="email" name="email" type="email" value="">
    <label><span>Email</span></label>
</div> 

<div>
  <label><span>Customer Address</span> <span class="kn-required">*</span></label>
  <div class="control">
    <input class="input" id="address1" name="address1" type="text" value="" >
    <label>Address 1</label>
  </div>
  <div class="control">
    <input class="input" id="address2" name="address2" type="text" value="">
    <label>Address 2</label>
  </div>
  <div class="control">
    <input class="input" id="address3" name="address3" type="text" value="">
    <label>Address 3</label>
  </div>
  <div class="control">
    <input class="input" id="address4" name="address4" type="text" value="">
    <label>Address 4</label>
  </div>
  <div class="control">
    <input class="input" id="postCode" name="postCode" type="text" value="">
    <label>Postal Code</label>
  </div>
</div> 
<div>
    Email: <select name="gdprEmail" id="gdprEmail"><option value=""></option><option value="on">Yes</option><option value="off">No</option></select>
    SMS: <select name="gdprSMS" id="gdprSMS"><option value=""></option><option value="on">Yes</option><option value="off">No</option></select>
    Phone: <select name="gdprPhone" id="gdprPhone"><option value=""></option><option value="on">Yes</option><option value="off">No</option></select>
    Post: <select name="gdprPost" id="gdprPost"><option value=""></option><option value="on">Yes</option><option value="off">No</option></select>
</div> 
<button type="submit" class="btn btn-primary">Create in Autoline</button>
</form>
<button class="btn btn-primary" onclick="cancelEdit(); return false;">Cancel edit</button>
